# Publishes the preview page to GitHub Pages so designers can see the kit
# without running anything. First run needs Pages enabled for the repository
# (Settings → Pages → Source: GitHub Actions); configure-pages tries to do it.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r css fonts assets preview _site/
          # The kit's font paths are absolute (/fonts/) for projects; on Pages
          # the site lives under /design-kit/, so make them relative to the CSS.
          sed -i 's#url("/fonts/#url("../fonts/#g' _site/css/foundations.css
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=preview/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
